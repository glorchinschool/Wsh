<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알고리즘 시각화 스튜디오 (Algorithm Visualizer)</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --secondary: #06b6d4;
      --accent: #f59e0b;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
      --bar-default: #6366f1;
      --bar-compare: #f59e0b;
      --bar-swap: #ef4444;
      --bar-sorted: #10b981;
      --cell-empty: #1e293b;
      --cell-wall: #475569;
      --cell-start: #10b981;
      --cell-target: #ef4444;
      --cell-visited: #3b82f688;
      --cell-path: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Pretendard', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 상단 네비게이션 헤더 */
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .brand-icon {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 1.1rem;
    }

    /* 카테고리 전환 탭 (정렬 vs 탐색) */
    .category-tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .cat-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-btn:hover { color: #fff; }
    .cat-btn.active {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }

    /* 세부 알고리즘 선택 버튼 */
    .sub-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .algo-btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .algo-btn:hover {
      background: var(--bg-card-hover);
      color: #fff;
    }

    .algo-btn.active {
      border-color: var(--secondary);
      background: rgba(6, 182, 212, 0.15);
      color: var(--secondary);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.25);
    }

    /* 메인 레이아웃 */
    .main-container {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      padding: 20px 24px;
      max-width: 1700px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    .control-group {
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.15);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.28);
    }

    .btn-secondary {
      background: var(--bg-card-hover);
      color: #e2e8f0;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: #334155;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--secondary);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
      transition: transform 0.1s ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* 통계 지표 그리드 */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-box {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }

    .algo-info-content {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .algo-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 6px;
      margin-bottom: 6px;
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.78rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* 시각화 워크스페이스 */
    .workspace {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 580px;
    }

    .view-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 520px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .view-header {
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .view-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      background: #0b1120;
      overflow: hidden;
    }

    /* 1. 정렬 막대 시각화 */
    .bars-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      padding: 10px 0;
    }

    .sort-bar {
      flex: 1;
      background: var(--bar-default);
      border-radius: 4px 4px 0 0;
      transition: height 0.08s ease, background-color 0.12s ease;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding-top: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .sort-bar.comparing {
      background: var(--bar-compare) !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
    }

    .sort-bar.swapping {
      background: var(--bar-swap) !important;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
      transform: scaleY(1.03);
    }

    .sort-bar.sorted {
      background: var(--bar-sorted) !important;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .sort-bar.min-candidate {
      background: #ec4899 !important;
    }

    /* 2. 격자 탐색 시각화 */
    .grid-container {
      display: grid;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 8px;
      overflow: hidden;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }

    .grid-cell {
      background: var(--cell-empty);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .grid-cell.wall {
      background: var(--cell-wall) !important;
      border-color: #64748b;
    }

    .grid-cell.start {
      background: var(--cell-start) !important;
    }
    .grid-cell.start::after {
      content: "S";
      font-weight: 800;
      color: #fff;
      font-size: 0.85rem;
    }

    .grid-cell.target {
      background: var(--cell-target) !important;
    }
    .grid-cell.target::after {
      content: "G";
      font-weight: 800;
      color: #fff;
      font-size: 0.85rem;
    }

    .grid-cell.visited {
      background: #2563eb88;
      animation: visitNode 0.25s ease-out forwards;
    }

    .grid-cell.frontier {
      background: #818cf8;
    }

    .grid-cell.path {
      background: #facc15 !important;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.8);
      animation: pathPop 0.3s ease-out forwards;
    }

    @keyframes visitNode {
      0% { transform: scale(0.3); background-color: #c084fc; border-radius: 100%; }
      100% { transform: scale(1); background-color: #2563eb88; }
    }

    @keyframes pathPop {
      0% { transform: scale(0.6); background-color: #fbbf24; }
      100% { transform: scale(1); background-color: #facc15; }
    }

    /* 3. 유전 알고리즘 캔버스 */
    .canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      border-radius: 8px;
      display: block;
    }

    .ga-overlay-info {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.82rem;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .instruction-bar {
      font-size: 0.8rem;
      color: #94a3b8;
      background: #0f172a;
      border-radius: 8px;
      padding: 8px 12px;
      border-left: 3px solid var(--secondary);
      margin-bottom: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 헤더 -->
  <header>
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <span>알고리즘 시각화 스튜디오</span>
    </div>

    <!-- 1차 카테고리 (정렬 vs 탐색) -->
    <div class="category-tabs">
      <button class="cat-btn active" id="tab-sort" onclick="switchCategory('sort')">
        <span>📊 정렬 알고리즘</span>
      </button>
      <button class="cat-btn" id="tab-search" onclick="switchCategory('search')">
        <span>🔍 탐색 알고리즘</span>
      </button>
    </div>

    <!-- 2차 세부 알고리즘 목록 -->
    <div class="sub-tabs" id="sub-tabs-container"></div>
  </header>

  <!-- 메인 본문 레이아웃 -->
  <div class="main-container">
    
    <!-- 사이드바: 컨트롤 및 지표 패널 -->
    <aside class="sidebar">
      
      <!-- 컨트롤러 카드 -->
      <div class="card">
        <div class="card-title">
          <span>🎮 실행 컨트롤</span>
        </div>

        <div class="btn-row" style="margin-bottom: 12px;">
          <button class="btn btn-primary" id="btn-play" onclick="togglePlay()">
            <span id="play-icon">▶</span> <span id="play-text">실행</span>
          </button>
          <button class="btn btn-secondary" id="btn-step" onclick="stepForward()">
            <span>⏭</span> 1단계
          </button>
          <button class="btn btn-danger" id="btn-reset" onclick="resetCurrentVisualizer()">
            <span>🔄</span> 리셋
          </button>
        </div>

        <div class="control-group">
          <label>
            <span>애니메이션 속도</span>
            <span id="speed-display">보통 (1x)</span>
          </label>
          <input type="range" id="speed-slider" min="1" max="10" value="5" oninput="updateSpeed(this.value)">
        </div>

        <!-- 동적 컨트롤 (정렬 vs 탐색 vs 유전) -->
        <div id="dynamic-controls"></div>
      </div>

      <!-- 실시간 통계 카드 -->
      <div class="card">
        <div class="card-title">
          <span>📈 실시간 통계 지표</span>
        </div>
        <div class="stats-grid" id="stats-container"></div>
      </div>

      <!-- 알고리즘 설명 및 복잡도 카드 -->
      <div class="card">
        <div class="card-title">
          <span>💡 알고리즘 설명 & 원리</span>
        </div>
        <div class="algo-info-content" id="algo-info-box"></div>
      </div>

    </aside>

    <!-- 시각화 메인 화면 -->
    <main class="workspace">
      <div class="view-container">
        <div class="view-header">
          <div class="view-title">
            <span id="current-view-badge">📊</span>
            <span id="current-view-title">선택 정렬 시각화</span>
          </div>
        </div>

        <div class="view-content" id="view-content-area"></div>
      </div>
    </main>

  </div>

  <script>
    /* 전역 상태 객체 */
    const state = {
      category: 'sort',
      algo: 'selection',
      isPlaying: false,
      isPaused: false,
      speed: 5,
      delay: 45,
      generator: null,
      animationTimer: null,
      
      // 정렬 상태
      sortArray: [],
      sortSize: 28,
      sortComparisons: 0,
      sortSwaps: 0,
      activeIndices: [],
      swapIndices: [],
      sortedIndices: new Set(),
      minCandidateIdx: -1,

      // 격자 탐색 상태 (BFS, DFS, 그리디)
      gridRows: 21,
      gridCols: 35,
      grid: [],
      startNode: { r: 10, c: 5 },
      targetNode: { r: 10, c: 29 },
      isMouseDown: false,
      dragMode: null,
      visitedCells: new Set(),
      frontierCells: new Set(),
      pathCells: [],
      searchStats: { explored: 0, pathLen: 0, frontierSize: 0 },

      // 유전 알고리즘 상태 (TSP)
      gaCities: [],
      gaCityCount: 22,
      gaPopulationSize: 80,
      gaMutationRate: 0.08,
      gaGeneration: 0,
      gaBestDistance: Infinity,
      gaBestPath: [],
      gaPopulation: [],
      gaCanvas: null,
      gaCtx: null
    };

    /* 알고리즘 메타데이터 & 설명 */
    const ALGO_DATA = {
      selection: {
        name: '선택 정렬 (Selection Sort)',
        category: 'sort',
        timeComplexity: 'O(N²)',
        spaceComplexity: 'O(1)',
        desc: `매 단계마다 정렬되지 않은 구간에서 <strong>최솟값(Minimum)</strong>을 찾아 현재 위치와 교환(Swap)하는 알고리즘입니다.<br><br>
        <span class="algo-badge">제자리 정렬</span><br>
        데이터 상태와 무관하게 일정한 비교 횟수(N(N-1)/2)를 수행합니다.`,
        legend: [
          { color: 'var(--bar-default)', text: '일반 원소' },
          { color: '#ec4899', text: '현재 최솟값 후보' },
          { color: 'var(--bar-compare)', text: '비교 중' },
          { color: 'var(--bar-swap)', text: '교환(Swap)' },
          { color: 'var(--bar-sorted)', text: '정렬 완료' }
        ]
      },
      insertion: {
        name: '삽입 정렬 (Insertion Sort)',
        category: 'sort',
        timeComplexity: '최선 O(N), 평균/최악 O(N²)',
        spaceComplexity: 'O(1)',
        desc: `정렬되지 않은 구간의 원소를 하나씩 뽑아, 앞쪽의 정렬된 구간에서 <strong>올바른 위치를 찾아 삽입</strong>하는 방식입니다.<br><br>
        <span class="algo-badge">안정 정렬</span>
        <span class="algo-badge">적응형 정렬</span><br>
        거의 정렬된 데이터일수록 비교 횟수가 크게 줄어들어 매우 빠릅니다.`,
        legend: [
          { color: 'var(--bar-default)', text: '일반 원소' },
          { color: 'var(--bar-compare)', text: '삽입 대상 키(Key)' },
          { color: 'var(--bar-swap)', text: '원소 밀어내기' },
          { color: 'var(--bar-sorted)', text: '정렬된 부분' }
        ]
      },
      bubble: {
        name: '버블 정렬 (Bubble Sort)',
        category: 'sort',
        timeComplexity: '최선 O(N), 평균/최악 O(N²)',
        spaceComplexity: 'O(1)',
        desc: `인접한 두 원소를 비교하여 큰 값을 계속 뒤로 교환하며 밀어내는 알고리즘입니다. 거품이 수면으로 떠오르는 모양새와 같습니다.<br><br>
        <span class="algo-badge">안정 정렬</span>
        <span class="algo-badge">제자리 정렬</span><br>
        매 패스(Pass)마다 가장 큰 원소가 맨 뒤로 확정됩니다.`,
        legend: [
          { color: 'var(--bar-default)', text: '일반 원소' },
          { color: 'var(--bar-compare)', text: '인접 원소 비교' },
          { color: 'var(--bar-swap)', text: '교환(Swap)' },
          { color: 'var(--bar-sorted)', text: '정렬 완료' }
        ]
      },
      bfs: {
        name: '너비 우선 탐색 (BFS)',
        category: 'search',
        timeComplexity: 'O(V + E)',
        spaceComplexity: 'O(V)',

    /* 카테고리 전환 */
    function switchCategory(cat) {
      if (state.isPlaying) pauseVisualizer();
      state.category = cat;

      document.getElementById('tab-sort').classList.toggle('active', cat === 'sort');
      document.getElementById('tab-search').classList.toggle('active', cat === 'search');

      const container = document.getElementById('sub-tabs-container');
      container.innerHTML = '';

      if (cat === 'sort') {
        const algos = [
          { id: 'selection', name: '선택 정렬' },
          { id: 'insertion', name: '삽입 정렬' },
          { id: 'bubble', name: '버블 정렬' }
        ];
        algos.forEach(a => {
          const btn = document.createElement('button');
          btn.className = `algo-btn ${state.algo === a.id ? 'active' : ''}`;
          btn.textContent = a.name;
          btn.onclick = () => selectAlgorithm(a.id);
          container.appendChild(btn);
        });
        if (!['selection', 'insertion', 'bubble'].includes(state.algo)) {
          state.algo = 'selection';
        }
      } else {
        const algos = [
          { id: 'bfs', name: '너비 우선 (BFS)' },
          { id: 'dfs', name: '깊이 우선 (DFS)' },
          { id: 'greedy', name: '그리디 탐색' },
          { id: 'ga', name: '유전 알고리즘 (TSP)' }
        ];
        algos.forEach(a => {
          const btn = document.createElement('button');
          btn.className = `algo-btn ${state.algo === a.id ? 'active' : ''}`;
          btn.textContent = a.name;
          btn.onclick = () => selectAlgorithm(a.id);
          container.appendChild(btn);
        });
        if (!['bfs', 'dfs', 'greedy', 'ga'].includes(state.algo)) {
          state.algo = 'bfs';
        }
      }

      selectAlgorithm(state.algo);
    }

    /* 알고리즘 선택 */
    function selectAlgorithm(algoId) {
      if (state.isPlaying) pauseVisualizer();
      state.algo = algoId;

      document.querySelectorAll('.algo-btn').forEach(btn => {
        const text = btn.textContent;
        const meta = ALGO_DATA[algoId];
        btn.classList.toggle('active', meta && meta.name.includes(text.replace(/ \(.*?\)/, '')));
      });

      renderDynamicControls();
      renderInfoCard();

      if (state.category === 'sort') {
        generateSortData('random');
      } else if (algoId === 'ga') {
        initGACanvas();
        resetGA();
      } else {
        initGridSearch();
      }
      updateStats();
    }

    /* 속도 및 실행 제어 */
    function updateSpeed(val) {
      state.speed = +val;
      const speeds = [250, 180, 120, 75, 45, 25, 14, 7, 3, 1];
      state.delay = speeds[state.speed - 1] || 30;
      const labels = ['매우 느림', '느림', '다소 느림', '조금 느림', '보통 (1x)', '조금 빠름', '다소 빠름', '빠름', '매우 빠름', '초고속 (Max)'];
      document.getElementById('speed-display').textContent = labels[state.speed - 1];
    }

    function togglePlay() {
      if (state.isPlaying) {
        pauseVisualizer();
      } else {
        startVisualizer();
      }
    }

    function startVisualizer() {
      state.isPlaying = true;
      state.isPaused = false;
      document.getElementById('play-icon').textContent = '⏸';
      document.getElementById('play-text').textContent = '일시정지';
      document.getElementById('btn-play').classList.replace('btn-primary', 'btn-secondary');

      if (!state.generator) {
        initGenerator();
      }
      runLoop();
    }

    function pauseVisualizer() {
      state.isPlaying = false;
      state.isPaused = true;
      clearTimeout(state.animationTimer);
      document.getElementById('play-icon').textContent = '▶';
      document.getElementById('play-text').textContent = '실행';
      document.getElementById('btn-play').classList.replace('btn-secondary', 'btn-primary');
      updateStats();
    }

    function stepForward() {
      if (state.isPlaying) pauseVisualizer();
      if (!state.generator) {
        initGenerator();
      }
      advanceStep();
    }

    function advanceStep() {
      if (!state.generator) return false;
      const res = state.generator.next();
      if (res.done) {
        pauseVisualizer();
        state.generator = null;
        updateStats();
        return false;
      }
      updateStats();
      return true;
    }

    function runLoop() {
      if (!state.isPlaying) return;
      const hasMore = advanceStep();
      if (hasMore) {
        state.animationTimer = setTimeout(runLoop, state.delay);
      }
    }

    function resetCurrentVisualizer() {
      pauseVisualizer();
      state.generator = null;
      if (state.category === 'sort') {
        generateSortData('random');
      } else if (state.algo === 'ga') {
        resetGA();
      } else {
        resetGridSearch();
      }
      updateStats();
    }

    function initGenerator() {
      if (state.category === 'sort') {
        if (state.algo === 'selection') state.generator = selectionSortGenerator();
        else if (state.algo === 'insertion') state.generator = insertionSortGenerator();
        else if (state.algo === 'bubble') state.generator = bubbleSortGenerator();
      } else if (state.algo === 'ga') {
        state.generator = gaGenerator();
      } else {
        if (state.algo === 'bfs') state.generator = bfsGenerator();
        else if (state.algo === 'dfs') state.generator = dfsGenerator();
        else if (state.algo === 'greedy') state.generator = greedyGenerator();
      }
    }

    /* ----------------------------------------------------
       1. 정렬 알고리즘 구현
       ---------------------------------------------------- */
    function changeSortSize(val) {
      state.sortSize = +val;
      document.getElementById('arr-size-display').textContent = val + '개';
      generateSortData('random');
    }

    function generateSortData(type = 'random') {
      pauseVisualizer();
      state.generator = null;
      state.sortComparisons = 0;
      state.sortSwaps = 0;
      state.activeIndices = [];
      state.swapIndices = [];
      state.sortedIndices.clear();
      state.minCandidateIdx = -1;

      const n = state.sortSize;
      let arr = [];
      for (let i = 0; i < n; i++) {
        arr.push(Math.round(((i + 1) / n) * 90) + 10);
      }

      if (type === 'random') {
        for (let i = n - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } else if (type === 'nearly') {
        const swaps = Math.max(2, Math.floor(n * 0.08));
        for (let k = 0; k < swaps; k++) {
          const i = Math.floor(Math.random() * n);
          const j = Math.floor(Math.random() * n);
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
      } else if (type === 'reverse') {
        arr.reverse();
      }

      state.sortArray = arr;
      renderSortBars();
      updateStats();
    }

    function renderSortBars() {
      const container = document.getElementById('view-content-area');
      let html = '<div class="bars-wrapper">';
      const showValues = state.sortArray.length <= 35;

      for (let i = 0; i < state.sortArray.length; i++) {
        const val = state.sortArray[i];
        let cls = 'sort-bar';
        if (state.sortedIndices.has(i)) cls += ' sorted';
        else if (state.swapIndices.includes(i)) cls += ' swapping';
        else if (i === state.minCandidateIdx) cls += ' min-candidate';
        else if (state.activeIndices.includes(i)) cls += ' comparing';

        html += `<div class="${cls}" style="height: ${val}%;" title="인덱스 ${i}: ${val}">
          ${showValues ? val : ''}
        </div>`;
      }
      html += '</div>';
      container.innerHTML = html;
    }

    // 선택 정렬 생성기
    function* selectionSortGenerator() {
      const arr = state.sortArray;
      const n = arr.length;

      for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        state.minCandidateIdx = minIdx;
        state.activeIndices = [i];
        state.swapIndices = [];
        renderSortBars();
        yield;

        for (let j = i + 1; j < n; j++) {
          state.sortComparisons++;
          state.activeIndices = [j];
          state.minCandidateIdx = minIdx;
          renderSortBars();
          yield;

          if (arr[j] < arr[minIdx]) {
            minIdx = j;
            state.minCandidateIdx = minIdx;
            renderSortBars();
            yield;
          }
        }

        if (minIdx !== i) {
          state.sortSwaps++;
          state.swapIndices = [i, minIdx];
          state.activeIndices = [];
          [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
          renderSortBars();
          yield;
        }

        state.sortedIndices.add(i);
        state.swapIndices = [];
        state.minCandidateIdx = -1;
        renderSortBars();
        yield;
      }

      state.sortedIndices.add(n - 1);
      state.activeIndices = [];
      state.swapIndices = [];
      state.minCandidateIdx = -1;
      renderSortBars();
    }

    // 삽입 정렬 생성기
    function* insertionSortGenerator() {
      const arr = state.sortArray;
      const n = arr.length;
      state.sortedIndices.add(0);

      for (let i = 1; i < n; i++) {
        let key = arr[i];
        let j = i - 1;

        state.activeIndices = [i];
        state.swapIndices = [];
        renderSortBars();
        yield;

        while (j >= 0) {
          state.sortComparisons++;
          state.activeIndices = [j, j + 1];
          renderSortBars();
          yield;

          if (arr[j] > key) {
            state.sortSwaps++;
            arr[j + 1] = arr[j];
            state.swapIndices = [j, j + 1];
            renderSortBars();
            yield;
            j--;
          } else {
            break;
          }
        }

        arr[j + 1] = key;
        for (let k = 0; k <= i; k++) state.sortedIndices.add(k);
        state.activeIndices = [];
        state.swapIndices = [];
        renderSortBars();
        yield;
      }
    }

    // 버블 정렬 생성기
    function* bubbleSortGenerator() {
      const arr = state.sortArray;
      const n = arr.length;

      for (let i = 0; i < n - 1; i++) {
        let swapped = false;

        for (let j = 0; j < n - i - 1; j++) {
          state.sortComparisons++;
          state.activeIndices = [j, j + 1];
          state.swapIndices = [];
          renderSortBars();
          yield;

          if (arr[j] > arr[j + 1]) {
            state.sortSwaps++;
            state.swapIndices = [j, j + 1];
            [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
            swapped = true;
            renderSortBars();
            yield;
          }
        }

        state.sortedIndices.add(n - 1 - i);
        renderSortBars();
        yield;

        if (!swapped) {
          for (let k = 0; k < n - i; k++) state.sortedIndices.add(k);
          break;
        }
      }

      for (let k = 0; k < n; k++) state.sortedIndices.add(k);
      state.activeIndices = [];
      state.swapIndices = [];
      renderSortBars();
    }

    /* ----------------------------------------------------
       2. 격자 탐색 알고리즘 구현 (BFS, DFS, 그리디)
       ---------------------------------------------------- */
    function initGridSearch() {
      state.grid = Array.from({ length: state.gridRows }, () => Array(state.gridCols).fill(0));
      state.visitedCells.clear();
      state.frontierCells.clear();
      state.pathCells = [];
      state.searchStats = { explored: 0, pathLen: 0, frontierSize: 0 };
      renderGrid();
      updateStats();
    }

    function resetGridSearch() {
      state.visitedCells.clear();
      state.frontierCells.clear();
      state.pathCells = [];
      state.searchStats = { explored: 0, pathLen: 0, frontierSize: 0 };
      renderGrid();
      updateStats();
    }

    function clearGridWalls() {
      pauseVisualizer();
      state.generator = null;
      for (let r = 0; r < state.gridRows; r++) {
        for (let c = 0; c < state.gridCols; c++) {
          state.grid[r][c] = 0;
        }
      }
      resetGridSearch();
    }

    function clearGridPathOnly() {
      pauseVisualizer();
      state.generator = null;
      resetGridSearch();
    }

    function generateRandomMaze() {
      pauseVisualizer();
      state.generator = null;
      resetGridSearch();

      for (let r = 0; r < state.gridRows; r++) {
        for (let c = 0; c < state.gridCols; c++) {
          if ((r === state.startNode.r && c === state.startNode.c) ||
              (r === state.targetNode.r && c === state.targetNode.c)) {
            state.grid[r][c] = 0;
            continue;
          }
          state.grid[r][c] = Math.random() < 0.28 ? 1 : 0;
        }
      }
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('view-content-area');
      const cellSize = Math.min(
        Math.floor((container.clientWidth - 40) / state.gridCols),
        Math.floor((container.clientHeight - 40) / state.gridRows),
        26
      );

      let gridEl = document.getElementById('search-grid');
      if (!gridEl) {
        container.innerHTML = `
          <div id="search-grid" class="grid-container" 
               style="grid-template-columns: repeat(${state.gridCols}, ${cellSize}px); 
                      grid-template-rows: repeat(${state.gridRows}, ${cellSize}px);"
               oncontextmenu="return false;">
          </div>
        `;
        gridEl = document.getElementById('search-grid');
        setupGridMouseEvents(gridEl);
      } else {
        gridEl.style.gridTemplateColumns = `repeat(${state.gridCols}, ${cellSize}px)`;
        gridEl.style.gridTemplateRows = `repeat(${state.gridRows}, ${cellSize}px)`;
      }

      gridEl.innerHTML = '';
      for (let r = 0; r < state.gridRows; r++) {
        for (let c = 0; c < state.gridCols; c++) {
          const cell = document.createElement('div');
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.className = 'grid-cell';

          if (r === state.startNode.r && c === state.startNode.c) cell.classList.add('start');
          else if (r === state.targetNode.r && c === state.targetNode.c) cell.classList.add('target');
          else if (state.pathCells.some(p => p.r === r && p.c === c)) cell.classList.add('path');
          else if (state.visitedCells.has(`${r},${c}`)) cell.classList.add('visited');
          else if (state.frontierCells.has(`${r},${c}`)) cell.classList.add('frontier');
          else if (state.grid[r][c] === 1) cell.classList.add('wall');

          gridEl.appendChild(cell);
        }
      }
    }

    function updateSingleCellClass(r, c) {
      const gridEl = document.getElementById('search-grid');
      if (!gridEl) return;
      const idx = r * state.gridCols + c;
      const cell = gridEl.children[idx];
      if (!cell) return;

      if (r === state.startNode.r && c === state.startNode.c) cell.className = 'grid-cell start';
      else if (r === state.targetNode.r && c === state.targetNode.c) cell.className = 'grid-cell target';
      else if (state.pathCells.some(p => p.r === r && p.c === c)) cell.className = 'grid-cell path';
      else if (state.visitedCells.has(`${r},${c}`)) cell.className = 'grid-cell visited';
      else if (state.frontierCells.has(`${r},${c}`)) cell.className = 'grid-cell frontier';
      else if (state.grid[r][c] === 1) cell.className = 'grid-cell wall';
      else cell.className = 'grid-cell';
    }

    function setupGridMouseEvents(gridEl) {
      gridEl.addEventListener('mousedown', e => {
        if (state.isPlaying) return;
        const target = e.target.closest('.grid-cell');
        if (!target) return;
        state.isMouseDown = true;

        const r = +target.dataset.r;
        const c = +target.dataset.c;

        if (r === state.startNode.r && c === state.startNode.c) {
          state.dragMode = 'moveStart';
        } else if (r === state.targetNode.r && c === state.targetNode.c) {
          state.dragMode = 'moveTarget';
        } else {
          state.dragMode = state.grid[r][c] === 1 ? 'eraseWall' : 'drawWall';
          handleCellInteract(r, c);
        }
      });

      window.addEventListener('mouseup', () => {
        state.isMouseDown = false;
        state.dragMode = null;
      });

      gridEl.addEventListener('mousemove', e => {
        if (!state.isMouseDown || state.isPlaying) return;
        const target = e.target.closest('.grid-cell');
        if (!target) return;
        handleCellInteract(+target.dataset.r, +target.dataset.c);
      });
    }

    function handleCellInteract(r, c) {
      if (state.dragMode === 'moveStart') {
        if (state.grid[r][c] !== 1 && !(r === state.targetNode.r && c === state.targetNode.c)) {
          const oldR = state.startNode.r, oldC = state.startNode.c;
          state.startNode = { r, c };
          updateSingleCellClass(oldR, oldC);
          updateSingleCellClass(r, c);
        }
      } else if (state.dragMode === 'moveTarget') {
        if (state.grid[r][c] !== 1 && !(r === state.startNode.r && c === state.startNode.c)) {
          const oldR = state.targetNode.r, oldC = state.targetNode.c;
          state.targetNode = { r, c };
          updateSingleCellClass(oldR, oldC);
          updateSingleCellClass(r, c);
        }
      } else if (state.dragMode === 'drawWall') {
        if (!(r === state.startNode.r && c === state.startNode.c) &&
            !(r === state.targetNode.r && c === state.targetNode.c)) {
          state.grid[r][c] = 1;
          updateSingleCellClass(r, c);
        }
      } else if (state.dragMode === 'eraseWall') {
        if (state.grid[r][c] === 1) {
          state.grid[r][c] = 0;
          updateSingleCellClass(r, c);
        }
      }
    }

    function getNeighbors(r, c) {
      const deltas = [[-1, 0], [0, 1], [1, 0], [0, -1]];
      const result = [];
      for (const [dr, dc] of deltas) {
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < state.gridRows && nc >= 0 && nc < state.gridCols && state.grid[nr][nc] !== 1) {
          result.push({ r: nr, c: nc });
        }
      }
      return result;
    }

    // BFS 생성기
    function* bfsGenerator() {
      state.visitedCells.clear();
      state.frontierCells.clear();
      state.pathCells = [];
      state.searchStats = { explored: 0, pathLen: 0, frontierSize: 0 };

      const queue = [{ r: state.startNode.r, c: state.startNode.c }];
      const parentMap = new Map();
      const startKey = `${state.startNode.r},${state.startNode.c}`;
      state.visitedCells.add(startKey);

      let found = false;

      while (queue.length > 0) {
        const curr = queue.shift();
        state.frontierCells.delete(`${curr.r},${curr.c}`);
        state.visitedCells.add(`${curr.r},${curr.c}`);
        state.searchStats.explored = state.visitedCells.size;
        state.searchStats.frontierSize = queue.length;
        updateSingleCellClass(curr.r, curr.c);

        if (curr.r === state.targetNode.r && curr.c === state.targetNode.c) {
          found = true;
          break;
        }
        yield;

        for (const nxt of getNeighbors(curr.r, curr.c)) {
          const key = `${nxt.r},${nxt.c}`;
          if (!state.visitedCells.has(key) && !state.frontierCells.has(key)) {
            state.frontierCells.add(key);
            parentMap.set(key, curr);
            queue.push(nxt);
            updateSingleCellClass(nxt.r, nxt.c);
          }
        }
      }

      if (found) {
        let curr = { r: state.targetNode.r, c: state.targetNode.c };
        const path = [];
        while (curr) {
          path.push(curr);
          curr = parentMap.get(`${curr.r},${curr.c}`);
        }
        path.reverse();

        for (const p of path) {
          state.pathCells.push(p);
          state.searchStats.pathLen = state.pathCells.length;
          updateSingleCellClass(p.r, p.c);
          yield;
        }
      }
    }

    // DFS 생성기
    function* dfsGenerator() {
      state.visitedCells.clear();
      state.frontierCells.clear();
      state.pathCells = [];
      state.searchStats = { explored: 0, pathLen: 0, frontierSize: 0 };

      const stack = [{ r: state.startNode.r, c: state.startNode.c }];
      const parentMap = new Map();
      let found = false;

      while (stack.length > 0) {
        const curr = stack.pop();
        const currKey = `${curr.r},${curr.c}`;
        if (state.visitedCells.has(currKey)) continue;

        state.visitedCells.add(currKey);
        state.frontierCells.delete(currKey);
        state.searchStats.explored = state.visitedCells.size;
        state.searchStats.frontierSize = stack.length;
        updateSingleCellClass(curr.r, curr.c);

        if (curr.r === state.targetNode.r && curr.c === state.targetNode.c) {
          found = true;
          break;
        }
        yield;

        for (const nxt of getNeighbors(curr.r, curr.c)) {
          const key = `${nxt.r},${nxt.c}`;
          if (!state.visitedCells.has(key)) {
            parentMap.set(key, curr);
            state.frontierCells.add(key);
            stack.push(nxt);
            updateSingleCellClass(nxt.r, nxt.c);
          }
        }
      }

      if (found) {
        let curr = { r: state.targetNode.r, c: state.targetNode.c };
        const path = [];
        while (curr) {
          path.push(curr);
          curr = parentMap.get(`${curr.r},${curr.c}`);
        }
        path.reverse();

        for (const p of path) {
          state.pathCells.push(p);
          state.searchStats.pathLen = state.pathCells.length;
          updateSingleCellClass(p.r, p.c);
          yield;
        }
      }
    }

    // 그리디 최선 우선 탐색 생성기
    function* greedyGenerator() {
      state.visitedCells.clear();
      state.frontierCells.clear();
      state.pathCells = [];
      state.searchStats = { explored: 0, pathLen: 0, frontierSize: 0 };

      const heuristic = (r, c) => Math.abs(r - state.targetNode.r) + Math.abs(c - state.targetNode.c);
      const pq = [{ r: state.startNode.r, c: state.startNode.c, h: heuristic(state.startNode.r, state.startNode.c) }];
      const parentMap = new Map();
      const startKey = `${state.startNode.r},${state.startNode.c}`;
      state.frontierCells.add(startKey);

      let found = false;

      while (pq.length > 0) {
        pq.sort((a, b) => a.h - b.h); // 휴리스틱 최솟값 우선
        const curr = pq.shift();
        const currKey = `${curr.r},${curr.c}`;

        state.frontierCells.delete(currKey);
        state.visitedCells.add(currKey);
        state.searchStats.explored = state.visitedCells.size;
        state.searchStats.frontierSize = pq.length;
        updateSingleCellClass(curr.r, curr.c);

        if (curr.r === state.targetNode.r && curr.c === state.targetNode.c) {
          found = true;
          break;
        }
        yield;

        for (const nxt of getNeighbors(curr.r, curr.c)) {
          const key = `${nxt.r},${nxt.c}`;
          if (!state.visitedCells.has(key) && !state.frontierCells.has(key)) {
            state.frontierCells.add(key);
            parentMap.set(key, curr);
            pq.push({ r: nxt.r, c: nxt.c, h: heuristic(nxt.r, nxt.c) });
            updateSingleCellClass(nxt.r, nxt.c);
          }
        }
      }

      if (found) {
        let curr = { r: state.targetNode.r, c: state.targetNode.c };
        const path = [];
        while (curr) {
          path.push(curr);
          curr = parentMap.get(`${curr.r},${curr.c}`);
        }
        path.reverse();

        for (const p of path) {
          state.pathCells.push(p);
          state.searchStats.pathLen = state.pathCells.length;
          updateSingleCellClass(p.r, p.c);
          yield;
        }
      }
    }

    /* ----------------------------------------------------
       3. 유전 알고리즘 (TSP) 구현
       ---------------------------------------------------- */
    function initGACanvas() {
      const container = document.getElementById('view-content-area');
      container.innerHTML = `
        <div class="canvas-container">
          <canvas id="ga-canvas"></canvas>
          <div class="ga-overlay-info">
            <div><strong>🧬 진화 연산 현황</strong></div>
            <div>세대: <span id="ga-badge-gen" style="color: #38bdf8; font-weight: bold;">0</span></div>
            <div>최적 거리: <span id="ga-badge-dist" style="color: #facc15; font-weight: bold;">0 px</span></div>
          </div>
        </div>
      `;

      state.gaCanvas = document.getElementById('ga-canvas');
      state.gaCtx = state.gaCanvas.getContext('2d');

      const resize = () => {
        const rect = container.getBoundingClientRect();
        state.gaCanvas.width = Math.max(rect.width - 24, 300);
        state.gaCanvas.height = Math.max(rect.height - 24, 420);
        drawGACanvas();
      };
      resize();

      // 마우스 클릭 시 도시 추가
      state.gaCanvas.onclick = (e) => {
        const rect = state.gaCanvas.getBoundingClientRect();
        addGACity(e.clientX - rect.left, e.clientY - rect.top);
      };

      if (state.gaCities.length === 0) {
        initGACities();
      } else {
        drawGACanvas();
      }
    }

    function changeGACityCount(val) {
      state.gaCityCount = +val;
      document.getElementById('ga-cities-display').textContent = val + '개';
      initGACities();
    }

    function initGACities() {
      pauseVisualizer();
      state.generator = null;
      state.gaCities = [];
      const w = state.gaCanvas ? state.gaCanvas.width : 700;
      const h = state.gaCanvas ? state.gaCanvas.height : 450;
      const padding = 45;

      for (let i = 0; i < state.gaCityCount; i++) {
        state.gaCities.push({
          x: padding + Math.random() * (w - padding * 2),
          y: padding + Math.random() * (h - padding * 2),
          id: i + 1
        });
      }
      resetGA();
    }

    function clearGACities() {
      pauseVisualizer();
      state.generator = null;
      state.gaCities = [];
      resetGA();
    }

    function addGACity(x, y) {
      if (state.isPlaying) pauseVisualizer();
      state.gaCities.push({ x, y, id: state.gaCities.length + 1 });
      resetGA();
    }

    function resetGA() {
      state.generator = null;
      state.gaGeneration = 0;
      state.gaBestDistance = Infinity;
      state.gaBestPath = [];
      state.gaPopulation = [];

      if (state.gaCities.length >= 3) {
        initGAPopulation();
        evaluatePopulation();
      }
      drawGACanvas();
      updateStats();
    }

    function initGAPopulation() {
      state.gaPopulation = [];
      const base = state.gaCities.map((_, idx) => idx);

      for (let i = 0; i < state.gaPopulationSize; i++) {
        const indiv = [...base];
        for (let j = indiv.length - 1; j > 0; j--) {
          const r = Math.floor(Math.random() * (j + 1));
          [indiv[j], indiv[r]] = [indiv[r], indiv[j]];
        }
        state.gaPopulation.push(indiv);
      }
    }

    function calculateDistance(path) {
      let total = 0;
      for (let i = 0; i < path.length; i++) {
        const c1 = state.gaCities[path[i]];
        const c2 = state.gaCities[path[(i + 1) % path.length]];
        const dx = c1.x - c2.x;
        const dy = c1.y - c2.y;
        total += Math.sqrt(dx * dx + dy * dy);
      }
      return total;
    }

    function evaluatePopulation() {
      for (let i = 0; i < state.gaPopulation.length; i++) {
        const dist = calculateDistance(state.gaPopulation[i]);
        if (dist < state.gaBestDistance) {
          state.gaBestDistance = dist;
          state.gaBestPath = [...state.gaPopulation[i]];
        }
      }
    }

    // 순서 교차 연산자 (OX Crossover)
    function crossover(parent1, parent2) {
      const n = parent1.length;
      const start = Math.floor(Math.random() * n);
      const end = Math.floor(Math.random() * (n - start)) + start;
      const child = Array(n).fill(-1);
      const inChild = new Set();

      for (let i = start; i <= end; i++) {
        child[i] = parent1[i];
        inChild.add(parent1[i]);
      }

      let p2Idx = 0;
      for (let i = 0; i < n; i++) {
        if (child[i] === -1) {
          while (inChild.has(parent2[p2Idx])) {
            p2Idx++;
          }
          child[i] = parent2[p2Idx];
          inChild.add(parent2[p2Idx]);
        }
      }
      return child;
    }

    // 돌연변이 연산자 (Swap Mutation)
    function mutate(individual) {
      if (Math.random() < state.gaMutationRate) {
        const n = individual.length;
        const i = Math.floor(Math.random() * n);
        const j = Math.floor(Math.random() * n);
        [individual[i], individual[j]] = [individual[j], individual[i]];
      }
    }

    // 유전 알고리즘 생성기
    function* gaGenerator() {
      if (state.gaCities.length < 3) return;

      if (state.gaPopulation.length === 0) {
        initGAPopulation();
        evaluatePopulation();
      }

      while (true) {
        state.gaGeneration++;
        const fitnesses = state.gaPopulation.map(indiv => 1 / (calculateDistance(indiv) + 0.0001));
        const totalFitness = fitnesses.reduce((acc, f) => acc + f, 0);

        const pickParent = () => {
          let rand = Math.random() * totalFitness;
          for (let i = 0; i < state.gaPopulation.length; i++) {
            rand -= fitnesses[i];
            if (rand <= 0) return state.gaPopulation[i];
          }
          return state.gaPopulation[state.gaPopulation.length - 1];
        };

        const nextPop = [];
        // 엘리티즘: 최고 적합도 개체 보존
        if (state.gaBestPath.length > 0) {
          nextPop.push([...state.gaBestPath]);
        }

        while (nextPop.length < state.gaPopulationSize) {
          const child = crossover(pickParent(), pickParent());
          mutate(child);
          nextPop.push(child);
        }

        state.gaPopulation = nextPop;
        evaluatePopulation();
        drawGACanvas();

        const badgeGen = document.getElementById('ga-badge-gen');
        const badgeDist = document.getElementById('ga-badge-dist');
        if (badgeGen) badgeGen.textContent = state.gaGeneration;
        if (badgeDist) badgeDist.textContent = Math.round(state.gaBestDistance) + ' px';

        yield;
      }
    }

    function drawGACanvas() {
      if (!state.gaCanvas || !state.gaCtx) return;
      const ctx = state.gaCtx;
      const w = state.gaCanvas.width;
      const h = state.gaCanvas.height;

      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, w, h);

      // 모눈 배경
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }

      if (state.gaCities.length === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = '15px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('도시가 없습니다. 상단에서 "새 도시 배치"를 누르거나 화면을 클릭해 추가하세요.', w / 2, h / 2);
        return;
      }

      // 최적 경로 선 그리기
      if (state.gaBestPath && state.gaBestPath.length > 1) {
        ctx.beginPath();
        const startCity = state.gaCities[state.gaBestPath[0]];
        ctx.moveTo(startCity.x, startCity.y);

        for (let i = 1; i < state.gaBestPath.length; i++) {
          const c = state.gaCities[state.gaBestPath[i]];
          ctx.lineTo(c.x, c.y);
        }
        ctx.closePath();

        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // 도시 노드 그리기
      for (let i = 0; i < state.gaCities.length; i++) {
        const city = state.gaCities[i];
        const isStart = i === (state.gaBestPath[0] ?? 0);

        ctx.beginPath();
        ctx.arc(city.x, city.y, isStart ? 8 : 6, 0, Math.PI * 2);
        ctx.fillStyle = isStart ? '#10b981' : '#38bdf8';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(city.id, city.x, city.y - 10);
      }
    }

    /* 초기 구동 이벤트 */
    window.addEventListener('resize', () => {
      if (state.category === 'search') {
        if (state.algo === 'ga') initGACanvas();
        else renderGrid();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      switchCategory('sort');
    });
  </script>
</body>
